<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>LIVE</title>
	<link rel="stylesheet" href="css/main.css">
</head>
<body>
	
 <div class="page">
 
    <header class="header">
      <a class="header__logo" href="/">
        <img class="header__logo-img" src="img/logo.svg" alt="LIVE">
      </a>
 
      <form class="search header__search" role="search">
        <input class="search__input" type="search" placeholder="Search" aria-label="Search">
        <button class="search__btn" type="submit" aria-label="Search">
          <img class="search__icon" src="img/icons/search.svg" alt="">
        </button>
      </form>
 
      <div class="header__actions">
        <button class="round-btn round-btn--accent" type="button" aria-label="Notifications">
          <img class="round-btn__icon" src="img/icons/bell.svg" alt="">
        </button>
        <button class="round-btn round-btn--light" type="button" aria-label="Messages">
          <img class="round-btn__icon" src="img/icons/mail.svg" alt="">
        </button>
        <a class="header__profile" href="/profile">
          <img class="header__avatar" src="img/avatar.png" alt="Profile">
        </a>
      </div>
    </header>
 
    <aside class="sidebar">
      <nav class="sidebar__section">
        <h2 class="sidebar__title">Menu</h2>
        <ul class="sidebar__list sidebar__list--menu">
          <li class="sidebar__item">
            <a class="sidebar__link" href="/" aria-label="Home">
              <img class="sidebar__icon" src="img/icons/home.svg" alt="">
            </a>
          </li>
          <li class="sidebar__item">
            <a class="sidebar__link" href="/videos" aria-label="Videos">
              <img class="sidebar__icon" src="img/icons/streams.svg" alt="">
            </a>
          </li>
          <li class="sidebar__item">
            <a class="sidebar__link" href="/shop" aria-label="Shop">
              <img class="sidebar__icon" src="img/icons/shop.svg" alt="">
            </a>
          </li>
        </ul>
      </nav>
 
      <section class="sidebar__section">
        <h2 class="sidebar__title">Following</h2>
        <ul class="sidebar__list sidebar__list--following">
          <li class="sidebar__item">
            <a class="avatar avatar--online" href="/user/1">
              <img class="avatar__img" src="img/following-1.jpg" alt="Streamer 1">
            </a>
          </li>
          <li class="sidebar__item">
            <a class="avatar avatar--offline" href="/user/2">
              <img class="avatar__img" src="img/following-2.jpg" alt="Streamer 2">
            </a>
          </li>
          <li class="sidebar__item">
            <a class="avatar avatar--offline" href="/user/3">
              <img class="avatar__img" src="img/following-3.jpg" alt="Streamer 3">
            </a>
          </li>
        </ul>
      </section>
    </aside>
 
    <main class="main">
			<div class="container">
				<section class="categories ">
        <h1 class="categories__title">Category</h1>
        <ul class="categories__list">
          <li class="categories__item">
            <a class="category-card" href="/category/communicate">
              <img class="category-card__img" src="img/categories/communicate.jpg" alt="">
              <span class="category-card__name">Communicate</span>
            </a>
          </li>
          <li class="categories__item">
            <a class="category-card" href="/category/gaming">
              <img class="category-card__img" src="img/categories/gaming.jpg" alt="">
              <span class="category-card__name">Gaming</span>
            </a>
          </li>
          <li class="categories__item">
            <a class="category-card" href="/category/music">
              <img class="category-card__img" src="img/categories/music.jpg" alt="">
              <span class="category-card__name">Music</span>
            </a>
          </li>
          <li class="categories__item">
            <a class="category-card" href="/category/turnir">
              <img class="category-card__img" src="img/categories/turnir.jpg" alt="">
              <span class="category-card__name">Turnir</span>
            </a>
          </li>
          <li class="categories__item">
            <a class="category-card" href="/category/education">
              <img class="category-card__img" src="img/categories/education.jpg" alt="">
              <span class="category-card__name">Education</span>
            </a>
          </li>
        </ul>
      </section>
			</div>
      
    </main>
 
    <footer class="footer">
      <ul class="footer__contacts">
        <li class="footer__contact footer__contact--title">Contact Us</li>
        <li class="footer__contact">
          <img class="footer__icon" src="img/icons/mail-small.svg" alt="">
          <a class="footer__link" href="mailto:LIVEsupport@mail.com">LIVEsupport@mail.com</a>
        </li>
        <li class="footer__contact">
          <img class="footer__icon" src="img/icons/phone.svg" alt="">
          <a class="footer__link footer__link--plain" href="tel:+99999999999">+9 99 999-99-99</a>
        </li>
      </ul>
 
      <ul class="footer__socials">
        <li class="footer__social">
          <a class="footer__social-link" href="#" aria-label="Instagram"><img src="img/icons/instagram.svg" alt=""></a>
        </li>
        <li class="footer__social">
          <a class="footer__social-link" href="#" aria-label="Telegram"><img src="img/icons/telegram.svg" alt=""></a>
        </li>
        <li class="footer__social">
          <a class="footer__social-link" href="#" aria-label="Facebook"><img src="img/icons/facebook.svg" alt=""></a>
        </li>
      </ul>
    </footer>
 
  </div>

</body>
</html>
